[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ccew_track"
version = "0.1.0"
description = "Object-based tracking of convectively coupled equatorial waves"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Quinton A. Lawton", email = "qlawton@ucar.edu" }
]
dependencies = [
    "numpy",
    "xarray",
    "scipy",
    "pandas",
]

[project.optional-dependencies]
plot = ["matplotlib"]
data = ["pooch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ccew_track*"]
